<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasures by Prakrithi · Story picks</title>
<style>
:root{--g:#0b3b2c;--d:#07261d;--gold:#c8a44d;--iv:#f7f1e4}
*{box-sizing:border-box}body{margin:0;background:var(--iv);color:var(--g);font-family:Georgia,'Times New Roman',serif}
header{background:var(--g);text-align:center;padding:22px 12px 16px;border-bottom:3px solid var(--gold)}
header img{width:260px;max-width:70%}header p{margin:8px 0 0;color:#e8dcb8;font-style:italic}
.wrap{max-width:560px;margin:0 auto;padding:16px}
input{width:100%;padding:12px 14px;border:1px solid var(--gold);border-radius:10px;font-size:16px;background:#fff;margin-bottom:6px}
.hint{font-size:13px;color:#6b6347;margin:0 0 14px}
.card{display:flex;gap:12px;background:#fff;border:1px solid #e6dcc0;border-radius:14px;padding:10px;margin:10px 0;text-decoration:none;color:inherit}
.card img{width:96px;height:128px;object-fit:cover;border-radius:8px;background:#eee}
.t{flex:1;display:flex;flex-direction:column;justify-content:space-between}.n{font-weight:bold;font-size:16px;line-height:1.25}
.c{font-family:Arial,sans-serif;font-size:13px;color:#6b6347;letter-spacing:.06em}
.b{align-self:flex-start;background:var(--g);color:var(--iv);padding:8px 16px;border-radius:20px;font-family:Arial,sans-serif;font-size:13px;letter-spacing:.1em}
h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 4px}
footer{text-align:center;font-size:13px;color:#6b6347;padding:20px}
</style></head><body>
<header><img src="assets/logo.png" alt="Treasures by Prakrithi"><p>Sarees from today's Stories</p></header>
<div class="wrap">
<input id="q" placeholder="Type a product code, e.g. PIH125" oninput="f()" autocomplete="off">
<p class="hint">Saw a saree in our Story? Enter its code to find it quickly.</p>
<h2>In today's Stories</h2><p>New Stories appear here as they are posted.</p>
</div><footer>prakrithibyramya.com</footer>
<script>function f(){var q=document.getElementById('q').value.toLowerCase();
document.querySelectorAll('.card').forEach(function(c){c.style.display=c.dataset.s.indexOf(q)>-1?'flex':'none'})}</script>
</body></html>
